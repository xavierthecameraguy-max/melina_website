name: Deploy to GitHub Pages

# Builds the site and publishes it to the gh-pages branch, which GitHub Pages serves
# (Settings → Pages → Source: Deploy from a branch, gh-pages, / (root)).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - id: pages
        uses: actions/configure-pages@v6
      - run: npm ci
      # base_path is "/melina_website" on github.io, or "" once a custom domain is set
      # (picked up on the next build after the domain is added).
      # While "demo" is true in src/_data/site.json this publishes the design preview (every
      # design side by side, scripts/build-demo.mjs); otherwise the site in the chosen design.
      - name: Build
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          if node -e "process.exit(JSON.parse(require('fs').readFileSync('src/_data/site.json', 'utf8')).demo ? 0 : 1)"; then
            npm run build:demo
          else
            npx @11ty/eleventy --pathprefix="$BASE_PATH/"
          fi
      # Replaces gh-pages with the new build. Keeps the CNAME file GitHub adds there when a custom
      # domain is set in Settings → Pages, so publishing never drops the domain.
      - name: Publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git ls-remote --exit-code origin gh-pages > /dev/null; then
            git fetch --depth=1 origin gh-pages
            git show FETCH_HEAD:CNAME > _site/CNAME 2> /dev/null || rm -f _site/CNAME
          fi
          touch _site/.nojekyll
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish ${GITHUB_SHA::7}"
          git push --force -q "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
