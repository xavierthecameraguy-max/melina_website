name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - id: pages
        uses: actions/configure-pages@v6
      - run: npm ci
      # base_path is "/melina_website" on github.io, or "" once a custom domain is set
      # (picked up on the next build after the domain is added).
      # While "demo" is true in src/_data/site.json this publishes the design preview (every
      # design side by side, scripts/build-demo.mjs); otherwise the site in the chosen design.
      - name: Build
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          if node -e "process.exit(JSON.parse(require('fs').readFileSync('src/_data/site.json', 'utf8')).demo ? 0 : 1)"; then
            npm run build:demo
          else
            npx @11ty/eleventy --pathprefix="$BASE_PATH/"
          fi
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
